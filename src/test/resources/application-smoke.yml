server:
  port: 0

spring:
  datasource:
    url: jdbc:h2:mem:smoke;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    open-in-view: false

app:
  jwt-secret: smoke-secret-key-smoke-secret-key-32b
  admin-username: admin
  admin-password: admin123
